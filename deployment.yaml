apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: mysql-alive
  name: mysql-alive
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mysql-alive
  template:
    metadata:
      labels:
        app: mysql-alive
    spec:
      containers:
        - image: 'shai2233/mysql-alive:'
          name: mysql-alive
